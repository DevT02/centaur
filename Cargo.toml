[package]
name = "the-clipboard-centaur"
version = "0.1.0"
edition = "2024"
description = "A clipboard bridge between browser-based AI coding assistants and local repositories"
repository = "https://github.com/DevT02/centaur"
readme = "README.md"
license = "MIT"

[[bin]]
name = "centaur"
path = "src/main.rs"

[dependencies]
arboard = "3.6.1"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.0"
dirs = "6.0"
ignore = "0.4.26"
inquire = "0.7"
regex = "1.12.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.39.5"
toml = "0.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
