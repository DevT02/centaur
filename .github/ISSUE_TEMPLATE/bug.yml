name: Bug report
description: Report a reproducible Centaur problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private source code, or personal paths. Report security issues through GitHub private vulnerability reporting instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its user impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use a synthetic repository or redacted fixture when possible.
      placeholder: |
        1. Run ...
        2. Provide ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Centaur version or commit
      placeholder: centaur 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste relevant `centaur doctor --redact-paths` output and check it manually before submitting.
      render: text
